[package]
name = "treasury"
version = "0.1.0"
description = "Fee reserve: splits creator fees into subsidy and holder buckets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "treasury"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = "1.2.1"

[dev-dependencies]
litesvm = "0.18"
litesvm-token = "0.18"
solana-address = "2.7"
solana-keypair = "3.1"
solana-signer = "3"
testkit = { path = "../../testkit" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
